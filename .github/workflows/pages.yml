name: Publish website

# Builds the extension, packages it for the site's Download button, and publishes
# site/ to the gh-pages branch, which GitHub Pages serves at
# https://jeevansai-k.github.io/webinel/
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'public/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble the site
        run: |
          version=$(node -p "require('./public/manifest.json').version")
          mkdir -p _site
          cp -R site/. _site/
          mkdir -p _site/download
          (cd dist && zip -qr "../_site/download/webinel-${version}.zip" .)
          touch _site/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
