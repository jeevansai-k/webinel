<div data-slot="header"></div>

<div class="screen-body scroll scan-now">
  <form class="inline-form" data-role="form" autocomplete="off" novalidate>
    <input class="input mono" data-role="url" type="text" inputmode="url" placeholder="Paste a link to scan" aria-label="URL to scan" spellcheck="false" />
    <button class="btn btn--primary" type="submit" data-action="scan"><span data-icon="search" data-icon-size="14"></span>Scan</button>
  </form>
  <p class="scan-now__note">
    Quick verdict in about 6 seconds. Links VirusTotal has never seen are submitted there and become visible to its community.
  </p>
  <div class="scan-timer" data-role="timer" hidden><span></span></div>
  <div data-role="result" aria-live="polite"></div>
  <button class="btn btn--block" type="button" data-action="full-analysis" hidden>
    <span data-icon="analysis" data-icon-size="14"></span>Run complete Advanced Analysis
  </button>
</div>

<div data-slot="footer"></div>
